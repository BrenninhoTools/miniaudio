name: Testing
on:
  push:
    branches: main
    paths-ignore:
      - 'LICENSE'
      - 'README.md'
      - 'CHANGELOG.md'
  workflow_dispatch:
jobs:
  Desktop:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install Dependencies
        run: |
          haxelib install hxcpp --quiet
          haxelib dev miniaudio .

      - name: Build Sample
        run: cd sample && haxe build.hxml

  Native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Native Test
        run: |
          g++ -std=c++17 -O1 -DMA_ENABLE_ONLY_SPECIFIC_BACKENDS -DMA_ENABLE_NULL -Iproject/include project/tests/native_test.cpp project/src/hxminiaudio.cpp -lpthread -ldl -lm -o native_test
          ./native_test

  Android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r21e

      - name: Install Dependencies
        run: |
          haxelib install hxcpp --quiet
          haxelib dev miniaudio .

      - name: Build Android
        env:
          ANDROID_NDK_ROOT: ${{steps.setup-ndk.outputs.ndk-path}}
        run: cd sample && haxe build-android.hxml
